name = "kak-ai-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"

vars = { ALLOWED_ORIGIN = "https://dhfaizali043-web.github.io", USER_LLM_PROVIDER = "gemini", USER_LLM_MODEL = "gemini-2.0-flash" }

# Secrets (do NOT put these in this file). Set them with:
#   wrangler secret put USER_LLM_API_KEY
#   wrangler secret put SOCIAL_PUBLISH_KEY     # shared key the admin sends as X-Social-Key
#   wrangler secret put IG_USER_ID             # Instagram Business account id (numeric)
#   wrangler secret put IG_ACCESS_TOKEN        # long-lived Facebook/Instagram token
#   wrangler secret put PINTEREST_TOKEN        # Pinterest API access token
#   wrangler secret put PINTEREST_BOARD_ID     # default board id for new pins
